name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # google-services.json diambil dari GitHub Secret (jangan di-commit).
      - name: Buat google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON belum diisi (lihat README)."; exit 1
          fi
          echo "$GS_JSON" > app/google-services.json

      - name: Build APK Orang Tua & Anak
        run: gradle assembleParentDebug assembleChildDebug --stacktrace

      - name: Upload APK Orang Tua
        uses: actions/upload-artifact@v4
        with:
          name: JagaAnak-Orang-Tua-apk
          path: app/build/outputs/apk/parent/debug/*.apk

      - name: Upload APK Anak
        uses: actions/upload-artifact@v4
        with:
          name: JagaAnak-Anak-apk
          path: app/build/outputs/apk/child/debug/*.apk

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/parent/debug/*.apk
            app/build/outputs/apk/child/debug/*.apk
